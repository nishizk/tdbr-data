name: Update Tesouro data

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 09:30 Brasilia, weekdays
    - cron: "30 20 * * 1-5"   # 17:30 Brasilia, weekdays (catches late publication)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and filter the official file
        run: python fetch_tesouro.py data/tesouro.csv
      - name: Commit if changed
        run: |
          git config user.name "tesouro-relay"
          git config user.email "actions@users.noreply.github.com"
          git add data/tesouro.csv
          git diff --cached --quiet || (git commit -m "Update Tesouro data" && git push)
