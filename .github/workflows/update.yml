name: Update Tesouro data

on:
  schedule:
    - cron: "17 11-23 * * 1-5"   # hourly at :17, 08:17-20:17 Brasilia, weekdays (GitHub often skips some runs)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: tesouro-update   # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and filter the official file
        run: python fetch_tesouro.py data/tesouro.csv
      - name: Replace the data commit (keeps the repo small)
        run: |
          git config user.name "tesouro-relay"
          git config user.email "actions@users.noreply.github.com"
          git add data/tesouro.csv
          if git diff --cached --quiet; then
            echo "No change today."
          elif [ "$(git log -1 --format=%s)" = "Update Tesouro data" ]; then
            git commit --amend --no-edit
            git push --force
          else
            git commit -m "Update Tesouro data"
            git push
          fi
